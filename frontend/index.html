<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akaradje — DeepSeek V4 Pro Chat</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .header {
            padding: 12px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .model-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        /* Settings bar */
        .settings {
            padding: 8px 24px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .settings label {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .settings select, .settings input[type="number"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        /* Chat area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message.assistant .thinking {
            color: var(--text-dim);
            font-style: italic;
            font-size: 12px;
            border-left: 2px solid var(--primary-light);
            padding-left: 10px;
            margin-bottom: 10px;
            display: none;
        }
        .message.assistant .thinking.visible { display: block; }
        .message .meta {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }
        .message .meta span {
            margin-right: 12px;
        }
        /* Streaming indicator */
        .streaming-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area textarea:focus {
            border-color: var(--primary);
        }
        .input-area button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover { opacity: 0.85; }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Status bar */
        .status-bar {
            padding: 6px 24px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>akaradje</h1>
        <span class="model-badge">DeepSeek V4 Pro · 1M context</span>
    </div>

    <div class="settings">
        <label>
            Effort:
            <select id="effort">
                <option value="">auto</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high" selected>high</option>
                <option value="max">max</option>
            </select>
        </label>
        <label>
            Complexity:
            <select id="complexity">
                <option value="">auto (router)</option>
                <option value="TRIVIAL">TRIVIAL</option>
                <option value="STANDARD">STANDARD</option>
                <option value="COMPLEX">COMPLEX</option>
            </select>
        </label>
        <label>
            <input type="checkbox" id="show-thinking"> Show thinking
        </label>
        <label>
            API:
            <input type="text" id="api-url" value="http://localhost:8000" style="width:180px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-size:12px;">
        </label>
    </div>

    <div class="chat-area" id="chat-area">
        <div class="message assistant">
            Welcome! I'm powered by DeepSeek V4 Pro with Opus 4.7-class scaffolding.<br>
            Ask me anything. Use the effort selector to control reasoning depth.
        </div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Type your message... (Shift+Enter for newline)" rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <div class="status-bar">
        <span id="status">Ready</span>
        <span id="stats">Total tokens: 0 | Cost: $0.000</span>
    </div>

    <script>
    const chatArea = document.getElementById('chat-area');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');
    const statsEl = document.getElementById('stats');

    let totalTokens = 0;
    let totalCost = 0;
    let isStreaming = false;

    // Auto-resize textarea
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    });

    // Enter to send, Shift+Enter for newline
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!isStreaming) sendMessage();
        }
    });

    function getApiUrl() {
        return document.getElementById('api-url').value.replace(/\/$/, '');
    }

    function addMessage(role, content, meta = null) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;
        if (meta) {
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.innerHTML = meta;
            div.appendChild(metaDiv);
        }
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    function createStreamingMessage() {
        const div = document.createElement('div');
        div.className = 'message assistant';

        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'thinking';
        div.appendChild(thinkingDiv);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.innerHTML = '<span class="streaming-dot"></span>';
        div.appendChild(contentDiv);

        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return { container: div, thinking: thinkingDiv, content: contentDiv };
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || isStreaming) return;

        isStreaming = true;
        sendBtn.disabled = true;
        input.value = '';
        input.style.height = 'auto';

        addMessage('user', text);
        statusEl.textContent = 'Thinking...';

        const effort = document.getElementById('effort').value || null;
        const complexity = document.getElementById('complexity').value || null;
        const showThinking = document.getElementById('show-thinking').checked;

        const body = { message: text };
        if (effort) body.effort = effort;
        if (complexity) body.force_complexity = complexity;

        const stream = createStreamingMessage();
        let fullContent = '';
        let fullThinking = '';

        try {
            const resp = await fetch(`${getApiUrl()}/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            if (!resp.ok) {
                // Fallback to non-streaming endpoint
                const resp2 = await fetch(`${getApiUrl()}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await resp2.json();
                fullContent = data.answer || data.detail || 'Error';
                stream.content.textContent = fullContent;

                const tokens = data.tokens_used || 0;
                totalTokens += tokens;
                totalCost += tokens * 0.0000035; // rough estimate

                const meta = `<span>${data.complexity || '?'}</span><span>effort: ${data.reasoning_effort || '?'}</span><span>${tokens} tokens</span>`;
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                metaDiv.innerHTML = meta;
                stream.container.appendChild(metaDiv);
            } else {
                // Process SSE stream
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const raw = line.slice(6).trim();
                        if (!raw || raw === '[DONE]') continue;

                        try {
                            const chunk = JSON.parse(raw);
                            if (chunk.type === 'content') {
                                fullContent += chunk.text;
                                stream.content.textContent = fullContent;
                                statusEl.textContent = 'Streaming...';
                            } else if (chunk.type === 'reasoning') {
                                fullThinking += chunk.text;
                                if (showThinking) {
                                    stream.thinking.textContent = fullThinking;
                                    stream.thinking.classList.add('visible');
                                }
                            } else if (chunk.type === 'done') {
                                const tokens = chunk.tokens || 0;
                                totalTokens += tokens;
                                totalCost += tokens * 0.0000035;
                                const meta = `<span>${chunk.complexity || '?'}</span><span>${tokens} tokens</span>`;
                                const metaDiv = document.createElement('div');
                                metaDiv.className = 'meta';
                                metaDiv.innerHTML = meta;
                                stream.container.appendChild(metaDiv);
                            }
                        } catch (e) { /* skip unparseable chunks */ }
                    }
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            }
        } catch (err) {
            stream.content.textContent = `Error: ${err.message}\n\nMake sure the API server is running:\n  uvicorn chatbot.api:app --port 8000`;
            stream.content.style.color = 'var(--error)';
        }

        // Show thinking toggle after completion
        if (fullThinking && showThinking) {
            stream.thinking.textContent = fullThinking;
            stream.thinking.classList.add('visible');
        }

        isStreaming = false;
        sendBtn.disabled = false;
        statusEl.textContent = 'Ready';
        statsEl.textContent = `Total tokens: ${totalTokens.toLocaleString()} | Cost: $${totalCost.toFixed(4)}`;
        input.focus();
    }
    </script>
</body>
</html>
