[project]
name = "akaradje-chatbot"
version = "0.1.0"
description = "Scaffolded chatbot with Router + ReAct + Verifier + Best-of-N over DeepSeek API"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "rich>=13.7.1",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
akaradje = "chatbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
